# ──────────────────────────────────────────────────────────────────
# Deploy: docker stack deploy -c alumni-stack.yml alumni
# (jalankan dari folder yang ada file ".env" di sebelahnya — docker
# stack deploy otomatis substitusi ${VAR} dari situ, sama seperti
# docker compose. env_file: TIDAK didukung Swarm, makanya semua
# variable ditulis eksplisit di x-app-env di bawah.)
#
# Alumni tidak butuh Redis/Reverb/queue worker terpisah — sesuai
# docs/PROJECT_SCOPE.md (sengaja tanpa itu di awal), dan Laravel 13
# defaultnya sudah pakai driver "database" untuk cache/session/queue,
# jadi cukup tabel yang sudah ada dari migration bawaan.
# ──────────────────────────────────────────────────────────────────

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-Alumni Management System}
  APP_ENV: production
  APP_KEY: ${APP_KEY}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL}

  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_LEVEL: ${LOG_LEVEL:-error}

  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-alumni}
  DB_USERNAME: ${DB_USERNAME:-laravel}
  DB_PASSWORD: ${DB_PASSWORD}

  CACHE_STORE: database
  SESSION_DRIVER: database
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  QUEUE_CONNECTION: sync
  FILESYSTEM_DISK: local

  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Alumni Management System}

services:
  # ─── PHP-FPM Laravel App ────────────────────────────────────────
  alumni_app:
    image: "${DOCKER_IMAGE:?set DOCKER_IMAGE, contoh yourusername/alumni:1.0.0}"
    user: "0:0"
    entrypoint: [""]
    command: >
      sh -c "php artisan storage:link &&
             cp -r /var/www/html/public/. /shared-public/ &&
             chmod -R 755 /shared-public &&
             php artisan config:cache && php artisan route:cache &&
             php artisan view:cache &&
             php-fpm"
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    volumes:
      - alumni_storage:/var/www/html/storage
      - alumni_public:/shared-public
    networks:
      - alumni_network
      - shared_network
    environment:
      <<: *app-env

  # ─── Nginx Web Server ────────────────────────────────────────────
  alumni_nginx:
    image: nginx:1.27-alpine
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    ports:
      - target: 80
        published: ${NGINX_PORT:-8086}
        protocol: tcp
        mode: ingress
    volumes:
      - ./nginx/default.swarm.conf:/etc/nginx/conf.d/default.conf:ro
      - alumni_public:/var/www/html/public
      - alumni_storage:/var/www/html/storage:ro
    networks:
      - alumni_network
      - shared_network
    depends_on:
      - alumni_app

volumes:
  alumni_storage:
    name: alumni_storage
    driver: local
    # 'local' aman selama alumni_app dan alumni_nginx tetap di-constraint
    # ke node worker yang SAMA. Kalau nanti nambah worker node, ganti ke
    # shared storage (NFS/Ceph) atau tambahkan node label constraint.
  alumni_public:
    name: alumni_public
    driver: local
    # Di-share antara alumni_app dan alumni_nginx supaya nginx bisa
    # menemukan index.php + asset. alumni_app meng-copy isi public/
    # (termasuk symlink storage/) ke sini setiap kali container start.

networks:
  alumni_network:
    name: alumni_network
    driver: overlay
    attachable: true
  shared_network:
    name: shared_network
    driver: overlay
    attachable: true
    external: true
