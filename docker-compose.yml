name: alumni

services:
  # ============================================================
  # PHP-FPM — aplikasi Laravel utama
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${APP_TARGET:-development}
    image: alumni-app:${APP_TARGET:-development}
    container_name: alumni_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - alumni_vendor:/var/www/html/vendor
      - alumni_node_modules:/var/www/html/node_modules
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
    networks:
      - network

  # ============================================================
  # Vite dev server — hot reload untuk resources/js & resources/css
  # ============================================================
  vite:
    image: node:20-alpine
    container_name: alumni_vite
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "${VITE_PORT:-5175}:5175"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
    networks:
      - network

  # ============================================================
  # Nginx — reverse proxy ke php-fpm, serve asset public/
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: alumni_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${NGINX_PORT:-8085}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - network

volumes:
  alumni_vendor:
    name: alumni_vendor
  alumni_node_modules:
    name: alumni_node_modules

networks:
  # Network shared dengan infrastructure (postgres, redis, nginx-proxy-manager, dst)
  # dan project lain (eduzone, lab-management) — network ini harus sudah ada
  # (dibuat oleh compose infrastructure), makanya external: true.
  network:
    name: network
    external: true
